version: 2

models:
  - name: dim_product
    description: Product dimension, one row per product_id (+ -1 unknown member).
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: pack_size
        description: Units per pack. Raw unit_cost / standard_unit_cost are per pack.
  - name: dim_store
    description: Store dimension with resolved region, one row per store_id (+ -1 unknown member).
    columns:
      - name: store_id
        tests: [unique, not_null]
      - name: store_opex_annual
        description: Direct store operating cost, treated as ANNUAL.
      - name: price_list
        description: Regular price list the store sells on (see int_store_price_list).
        tests: [not_null]
  - name: fct_sales
    description: >
      Sales fact at transaction-line grain (one row per transaction_id). Net sales = quantity x unit_price
      (returns are negative). Gross margin on landed cost per unit; standard-cost margin for sensitivity.
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: landed_cost_per_unit
        tests: [not_null]
  - name: mart_kpi_yearly
    description: Company KPIs per year with YoY abs/% for Net Sales, Gross Margin, Store Contribution and price.
    columns:
      - name: transaction_year
        tests: [unique, not_null]
  - name: mart_product_yearly
    description: Product x year performance (sales, margin, ASP incl. location mix, landed cost). Growth bridge lives in mart_sales_bridge_yearly.
  - name: mart_store_yearly
    description: Store x year P&L to store contribution.
  - name: mart_sales_monthly
    description: Month x category x region trend.
  - name: mart_price_monthly
    description: >
      Product x month price health - reference list price, landed cost, list markup, realised price,
      price realisation vs list, and promo unit share.
  - name: mart_sales_bridge_yearly
    description: >
      Net Sales YoY bridge per product-year - volume, location (price list) mix, like-for-like price,
      new product. Components sum exactly to net_sales_yoy_abs (tested). Replaces the earlier product-level
      price/volume split, which counted the shift towards California as price.
  - name: mart_price_list_yearly
    description: >
      Price list x year store economics (stores, units per sq ft, sales, GM%, opex, contribution with
      annual / pro-rated / monthly opex, loss-making store counts). Excludes the unknown store.
